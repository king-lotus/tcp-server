# What this job can claim, and what it cannot.
#
# verify/run.sh is the real gate: the suite compiled and run under plain,
# asan+ubsan and tsan, plus cpplint on the header. All of it is Linux work, so an
# ubuntu-latest runner covers the whole project. The counts are left out on
# purpose -- reactor_spread alone doubled one of them, and a number in a comment
# is a number that goes stale without anything failing.
#
# There is no second, host-side check to run beside it: the header needs epoll
# and eventfd, so a host that cannot run it cannot check it either.
#
# One thing this job does that no local run has managed: GitHub's runner has a
# real kernel. send_results' hup/err case asks the host whether EPOLLHUP|EPOLLERR
# are actually delivered and prints [SKIP] when they are not. On the old WSL
# host they were not -- an aborted connection arrives as an ordinary FIN -- so
# that case sat unexecuted through three review rounds. Here it runs and
# asserts. The last step files the verdict, per configuration, where anyone can
# read it back, and fails the job if any case declined: on this runner a skip
# means the gate did not assert, not that the kernel has an opinion.
name: verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    # verify/run.sh bounds each case at 180s (plain) or 300s (sanitizers), so a
    # hung case presents as a failure rather than as an idle job.
    timeout-minutes: 60

    steps:
      # v5 rather than v4: v4 still runs on Node 20, which the runner now accepts
      # only with a deprecation annotation against .github/workflows. That
      # warning crowds out the ones this job is actually trying to file.
      - uses: actions/checkout@v5

      # The script installs build-essential itself if g++ is missing; doing it
      # here keeps that branch from ever being taken, and hides its apt chatter.
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip

      - name: cpplint
        # Ubuntu marks its system python externally-managed, so the plain
        # install is refused. The fallback is for images that predate that.
        run: |
          python3 -m pip install --break-system-packages -q cpplint ||
            python3 -m pip install -q cpplint
          python3 -m cpplint --version

      - name: the suite under plain, asan+ubsan and tsan
        env:
          ENABLE_ASAN: "1"
          ENABLE_TSAN: "1"
        run: |
          # pipefail so the tee cannot launder a failing suite into a green job.
          set -o pipefail
          bash verify/run.sh 2>&1 | tee /tmp/verify-run.log

      # Keep the full matrix log when the job fails. The Actions log endpoint
      # requires repository admin rights, and without the artifact the first
      # thing a red run forces is a local reproduction; `always()` also keeps
      # the log when the step above timed out or was cancelled.
      - name: verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-run-log
          path: /tmp/verify-run.log
          if-no-files-found: ignore

      # Separate from the matrix above: this is one kernel-behaviour assertion,
      # not something that needs three sanitizer builds. It used to be possible
      # for the spare-descriptor path to regress while every suite stayed green,
      # because the probe lived in verify/evidence/ and nothing called it. The
      # probe lowers its own descriptor ceiling and fails if the victim waits,
      # is not reset, or the listener does not recover; a kernel that never
      # reaches EMFILE reports [SKIP] rather than a pass.
      - name: EMFILE probe
        run: bash verify/evidence/run_emfile.sh

      # Three reasons this exists, and the second one is why the first version
      # of it was not enough.
      #
      # 1. A [SKIP] used to leave the job green. "asserted and passed" and
      #    "asked the kernel and declined" looked exactly alike, so the truth
      #    about hup/err -- the one case that could never execute locally --
      #    stayed buried in a log nobody opens. The step now names every
      #    decline and fails the job; the annotation is readable off the
      #    checks API whether or not the reader is signed in.
      # 2. A case is free to run under plain and decline under tsan. The first
      #    version read only the first hup/err paragraph, so a skip in any later
      #    configuration would have been reported as that first verdict -- the
      #    same false comfort this step exists to remove, in a new place. It now
      #    reports one verdict per configuration.
      # 3. Anything else that declined gets named together with the pass it fell
      #    in, because "1 case skipped" invites every reader to assume it was
      #    not theirs.
      #
      # On this runner a declined case is a gate failure, not a judgement call:
      # ubuntu-latest delivers EPOLLHUP|EPOLLERR, so the hup/err case is
      # expected to run, and "skipped" would otherwise be indistinguishable
      # from "passed" in the job's exit code. Local runs stay lenient because
      # WSL kernels legitimately turn a reset into an ordinary FIN.
      - name: what this kernel was willing to tell us
        if: always()
        run: |
          log=/tmp/verify-run.log
          if [ ! -f "$log" ]; then
            echo "::warning title=skipped cases::the suite left no log to read"
            exit 0
          fi

          # Name the failing line and the run that produced it in the checks
          # API. The suite step's exit code already fails the job; this is what
          # makes the failure readable without downloading the artifact.
          failures=$(grep -E '\[FAIL\]|-> rc=[1-9]' "$log" || true)
          if [ -n "$failures" ]; then
            echo "::group::failing lines"
            printf '%s\n' "$failures"
            echo "::endgroup::"
            while IFS= read -r line; do
              [ -n "$line" ] &&
                  printf '::error title=suite failure::%s\n' "$line"
            done <<< "$failures"
          fi

          # Every [SKIP] line with the pass it happened in. Each configuration
          # announces itself with "---- running [title] ----", so whichever one
          # was last seen owns every line after it.
          #
          # The pattern is anchored, and had to be. The suite's skip() helper puts
          # the marker first on the line, but the closing notes of
          # verify/run.sh quote the same word in prose ("A [SKIP] line is
          # a case that asked the machine a question first ...") -- as free text
          # anywhere in the line, that paragraph counted itself as one case too,
          # and reported a decline nobody had made.
          report=$(
              awk '
                BEGIN { cfg="?" }
                /^---- running \[/ {
                    cfg=$0; sub(/^---- running \[/,"",cfg); sub(/\].*/,"",cfg)
                }
                /^[ \t]*\[SKIP\]/ { line=$0; sub(/^[ \t]+/,"",line); print cfg ": " line }
              ' "$log"
          )
          echo "::group::cases that declined to assert"
          if [ -n "$report" ]; then printf '%s\n' "$report"; else echo "(none)"; fi
          echo "::endgroup::"
          while IFS= read -r line; do
              [ -n "$line" ] &&
                  printf '::notice title=case declined to assert::%s\n' "$line"
          done <<< "$report"
          declined=0
          if [ -n "$report" ]; then
              echo "::error title=case declined to assert::at least one case did not run on this runner; a skipped assertion is not a pass"
              declined=1
          fi

          # One hup/err verdict per configuration: the paragraph opening with its
          # title, taken up to the blank line that closes it. A fixed number of
          # lines instead drags in the next case's heading.
          verdicts=$(
              awk '
                BEGIN { cfg="?" }
                function flush() {
                    if (f) printf "%s\t%s\n", (buf ~ /\[SKIP\]/ ? "skip" : "ran"), cfg
                    f=0
                }
                /^---- running \[/ {
                    flush()
                    cfg=$0; sub(/^---- running \[/,"",cfg); sub(/\].*/,"",cfg)
                    next
                }
                /^hup\/err:/ { f=1; buf=$0; next }
                f && NF==0 { flush(); next }
                f { buf = buf " " $0 }
                END { flush() }
              ' "$log"
          )
          if [ -z "$verdicts" ]; then
              echo "::warning title=hup/err::no such case in the suite output"
              exit "$declined"
          fi
          ran=$(printf '%s\n' "$verdicts" | grep -c '^ran' || true)
          skipped=$(printf '%s\n' "$verdicts" | grep -c '^skip' || true)
          detail=$(printf '%s\n' "$verdicts" | tr '\t' '=' |
                   paste -sd ';' - | sed 's/;/; /g')
          if [ "$skipped" -eq 0 ]; then
              echo "::notice title=hup/err ran in $ran configuration(s)::$detail"
          else
              echo "::warning title=hup/err skipped in $skipped of $((ran + skipped)) configuration(s)::$detail"
              declined=1
          fi
          exit "$declined"
